{% extends "base.html" %}

{% block title %}چت با دستیار{% endblock %}
{% block page_title %}چت با دستیار هوشمند{% endblock %}

{% block styles %}
<style>
    .direct-chat-messages {
        height: 500px;
        display: flex;
        flex-direction: column;
    }
    .direct-chat-msg {
        max-width: 80%;
    }
    .right .direct-chat-msg {
        align-self: flex-end;
    }
    .direct-chat-text {
        word-wrap: break-word;
    }
    .direct-chat-text img {
        max-width: 100%;
        border-radius: 5px;
        margin-top: 5px;
    }
    #chat-input-container {
        position: relative;
        border: 1px solid #ced4da;
        border-radius: .25rem;
        padding: 10px;
    }
    #message-input {
        border: none;
        resize: none;
        width: 100%;
        padding-right: 40px; /* Space for the upload button */
    }
    #message-input:focus {
        outline: none;
        box-shadow: none;
    }
    #image-preview-container {
        margin-top: 10px;
        position: relative;
        display: inline-block;
    }
    #image-preview {
        max-width: 80px;
        max-height: 80px;
        border-radius: 5px;
    }
    #remove-image-btn {
        position: absolute;
        top: -10px;
        right: -10px;
        background: #fff;
        border-radius: 50%;
        cursor: pointer;
        display: none;
    }
    #upload-button {
        position: absolute;
        left: 10px;
        top: 50%;
        transform: translateY(-50%);
    }
</style>
{% endblock %}

{% block content %}
<div class="card direct-chat direct-chat-primary">
    <div class="card-header">
        <h3 class="card-title">گفتگو</h3>
    </div>
    <div class="card-body">
        <div class="direct-chat-messages" id="chat-box">
            <!-- Messages appear here -->
        </div>
    </div>
    <div class="card-footer">
        <form id="chat-form">
            <div id="chat-input-container">
                <textarea id="message-input" name="message" placeholder="اینجا بنویس..." class="form-control" rows="1"></textarea>
                <div id="image-preview-container">
                    <img id="image-preview" src="#" alt="Image Preview"/>
                    <button type="button" id="remove-image-btn" class="btn btn-xs btn-danger"><i class="fas fa-times"></i></button>
                </div>
                <div id="upload-button">
                    <label for="image-upload" class="btn btn-light btn-sm">
                        <i class="fas fa-paperclip"></i>
                    </label>
                    <input type="file" id="image-upload" name="image" accept="image/*" style="display: none;">
                </div>
            </div>
            <button type="submit" id="send-button" class="btn btn-primary mt-2 float-left">ارسال</button>
        </form>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
document.addEventListener("DOMContentLoaded", function() {
    const chatForm = document.getElementById('chat-form');
    const chatBox = document.getElementById('chat-box');
    const messageInput = document.getElementById('message-input');
    const sendButton = document.getElementById('send-button');
    const imageUpload = document.getElementById('image-upload');
    const imagePreviewContainer = document.getElementById('image-preview-container');
    const imagePreview = document.getElementById('image-preview');
    const removeImageBtn = document.getElementById('remove-image-btn');

    let uploadedFile = null;

    // Auto-resize textarea
    messageInput.addEventListener('input', function () {
        this.style.height = 'auto';
        this.style.height = (this.scrollHeight) + 'px';
    });

    imageUpload.addEventListener('change', function(e) {
        if (e.target.files && e.target.files[0]) {
            uploadedFile = e.target.files[0];
            const reader = new FileReader();
            reader.onload = function(event) {
                imagePreview.src = event.target.result;
                imagePreviewContainer.style.display = 'inline-block';
                removeImageBtn.style.display = 'inline-block';
            }
            reader.readAsDataURL(uploadedFile);
        }
    });

    removeImageBtn.addEventListener('click', function() {
        uploadedFile = null;
        imageUpload.value = '';
        imagePreviewContainer.style.display = 'none';
        removeImageBtn.style.display = 'none';
    });

    function addMessage(role, text, imageUrl = null) {
        const isUser = role === 'user';
        const align = isUser ? 'right' : '';
        const name = isUser ? 'شما' : 'دستیار';
        const nameFloat = isUser ? 'right' : 'left';
        const timeFloat = isUser ? 'left' : 'right';
        const time = new Date().toLocaleTimeString('fa-IR', { hour: '2-digit', minute: '2-digit' });

        let imageHtml = '';
        if (imageUrl) {
            imageHtml = `<img src="${imageUrl}" style="max-width: 200px; border-radius: 5px; margin-top: 5px;" alt="uploaded image">`;
        }

        const msgHtml = `
        <div class="direct-chat-msg ${align}">
            <div class="direct-chat-infos clearfix">
                <span class="direct-chat-name float-${nameFloat}">${name}</span>
                <span class="direct-chat-timestamp float-${timeFloat}">${time}</span>
            </div>
            <img class="direct-chat-img" src="/static/dist/img/user-placeholder.png" alt="message user image">
            <div class="direct-chat-text">
                ${text.replace(/\n/g, '<br>')}
                ${imageHtml}
            </div>
        </div>`;

        chatBox.insertAdjacentHTML('beforeend', msgHtml);
        chatBox.scrollTop = chatBox.scrollHeight;
    }

    chatForm.addEventListener('submit', async function(e) {
        e.preventDefault();

        const messageText = messageInput.value.trim();
        if (messageText === '' && !uploadedFile) return;

        addMessage('user', messageText, uploadedFile ? URL.createObjectURL(uploadedFile) : null);

        const formData = new FormData();
        formData.append('message', messageText);
        if (uploadedFile) {
            formData.append('image', uploadedFile);
        }

        // Reset form
        messageInput.value = '';
        messageInput.style.height = 'auto';
        removeImageBtn.click();
        sendButton.disabled = true;
        sendButton.innerHTML = '<i class="fas fa-spinner fa-spin"></i>';

        try {
            const response = await fetch('/api/chat', {
                method: 'POST',
                body: formData,
            });

            if (!response.ok) throw new Error('Network response was not ok.');

            const data = await response.json();
            addMessage('assistant', data.response);

        } catch (error) {
            console.error("Error sending message:", error);
            addMessage('assistant', "متاسفانه مشکلی در ارتباط با سرور پیش آمده.");
        } finally {
            sendButton.disabled = false;
            sendButton.innerHTML = 'ارسال';
            messageInput.focus();
        }
    });

    chatBox.scrollTop = chatBox.scrollHeight;
});
</script>
{% endblock %}
