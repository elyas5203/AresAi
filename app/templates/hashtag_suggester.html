{% extends "base.html" %}

{% block title %}پیشنهاد هوشمند هشتگ{% endblock %}
{% block page_title %}پیشنهاد هوشمند هشتگ{% endblock %}

{% block content %}
<div class="card card-primary">
    <div class="card-header">
        <h3 class="card-title">هشتگ‌های مناسب برای پست اینستاگرام خود را پیدا کنید</h3>
    </div>
    <!-- /.card-header -->
    <!-- form start -->
    <form id="hashtag-form" method="post" enctype="multipart/form-data">
        <div class="card-body">
            <div class="form-group">
                <label for="caption">کپشن پست</label>
                <textarea class="form-control" id="caption" name="caption" rows="5" placeholder="کپشن پست خود را اینجا وارد کنید..."></textarea>
            </div>
            <div class="form-group">
                <label for="image">تصویر پست (اختیاری)</label>
                <div class="input-group">
                    <div class="custom-file">
                        <input type="file" class="custom-file-input" id="image" name="image">
                        <label class="custom-file-label" for="image">انتخاب فایل</label>
                    </div>
                </div>
            </div>
            <div id="hashtag-result" class="mt-4" style="display: none;">
                <h4>هشتگ‌های پیشنهادی:</h4>
                <div class="p-3 bg-light" style="border-radius: 5px; white-space: normal; word-wrap: break-word;">
                    <p id="hashtags"></p>
                    <button type="button" class="btn btn-sm btn-outline-secondary" id="copy-btn">کپی کردن هشتگ‌ها</button>
                </div>
            </div>
        </div>
        <!-- /.card-body -->

        <div class="card-footer">
            <button type="submit" class="btn btn-primary" id="submit-btn">دریافت هشتگ</button>
        </div>
    </form>
</div>
{% endblock %}

{% block scripts %}
<script>
document.addEventListener("DOMContentLoaded", function() {
    const form = document.getElementById('hashtag-form');
    const resultDiv = document.getElementById('hashtag-result');
    const hashtagsP = document.getElementById('hashtags');
    const copyBtn = document.getElementById('copy-btn');
    const submitBtn = document.getElementById('submit-btn');

    form.addEventListener('submit', async function(e) {
        e.preventDefault();

        const formData = new FormData(this);

        submitBtn.disabled = true;
        submitBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> در حال پردازش...';

        try {
            const response = await fetch('/api/suggest-hashtags', {
                method: 'POST',
                body: formData,
            });

            if (!response.ok) throw new Error('Network response was not ok.');

            const data = await response.json();
            hashtagsP.innerText = data.hashtags;
            resultDiv.style.display = 'block';

        } catch (error) {
            console.error('Error:', error);
            hashtagsP.innerText = "متاسفانه مشکلی در دریافت هشتگ‌ها پیش آمد.";
            resultDiv.style.display = 'block';
        } finally {
            submitBtn.disabled = false;
            submitBtn.innerHTML = 'دریافت هشتگ';
        }
    });

    copyBtn.addEventListener('click', function() {
        navigator.clipboard.writeText(hashtagsP.innerText).then(function() {
            copyBtn.innerText = 'کپی شد!';
            setTimeout(() => { copyBtn.innerText = 'کپی کردن هشتگ‌ها'; }, 2000);
        }, function(err) {
            console.error('Could not copy text: ', err);
        });
    });

    // Show filename in file input
    $('.custom-file-input').on('change', function() {
        let fileName = $(this).val().split('\\').pop();
        $(this).next('.custom-file-label').addClass("selected").html(fileName);
    });
});
</script>
{% endblock %}
