<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}دستیار کسب و کار{% endblock %}</title>

  <!-- Google Font: Vazirmatn -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;700&display=swap" rel="stylesheet">

  <!-- Font Awesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <!-- AdminLTE style -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/admin-lte/3.2.0/css/adminlte.min.css">

  <!-- Custom Style -->
  <link rel="stylesheet" href="{{ url_for('static', filename='dist/css/custom.css') }}">

  {% block styles %}{% endblock %}
</head>
<body class="hold-transition sidebar-mini layout-fixed">
<div class="wrapper">

  <!-- Navbar -->
  <nav class="main-header navbar navbar-expand navbar-white navbar-light">
    <ul class="navbar-nav">
      <li class="nav-item">
        <a class="nav-link" data-widget="pushmenu" href="#" role="button"><i class="fas fa-bars"></i></a>
      </li>
    </ul>
  </nav>
  <!-- /.navbar -->

  <!-- Main Sidebar Container -->
  <aside class="main-sidebar sidebar-dark-primary elevation-4">
    <a href="/" class="brand-link">
      <span class="brand-text font-weight-light">دستیار هوشمند</span>
    </a>
    <div class="sidebar">
      <nav class="mt-2">
        <ul class="nav nav-pills nav-sidebar flex-column" data-widget="treeview" role="menu" data-accordion="false">
          <li class="nav-item"><a href="/" class="nav-link {% if request.path == '/' %}active{% endif %}"><i class="nav-icon fas fa-tachometer-alt"></i><p>داشبورد</p></a></li>
          <li class="nav-item"><a href="/competitors" class="nav-link {% if request.path == '/competitors' %}active{% endif %}"><i class="nav-icon fas fa-chart-bar"></i><p>تحلیل رقبا</p></a></li>
          <li class="nav-item"><a href="/chat" class="nav-link {% if request.path == '/chat' %}active{% endif %}"><i class="nav-icon fas fa-comments"></i><p>چت با دستیار</p></a></li>
          <li class="nav-item"><a href="/competitor-dashboard" class="nav-link {% if request.path == '/competitor-dashboard' %}active{% endif %}"><i class="nav-icon fas fa-chart-pie"></i><p>داشبورد رقبا</p></a></li>
          <li class="nav-item"><a href="/hashtag-suggester" class="nav-link {% if request.path == '/hashtag-suggester' %}active{% endif %}"><i class="nav-icon fas fa-hashtag"></i><p>پیشنهاد هشتگ</p></a></li>
        </ul>
      </nav>
    </div>
  </aside>

  <!-- Content Wrapper. Contains page content -->
  <div class="content-wrapper">
    <section class="content-header">
      <div class="container-fluid">
        <div class="row mb-2">
          <div class="col-sm-6">
            <h1>{% block page_title %}{% endblock %}</h1>
          </div>
        </div>
      </div>
    </section>
    <section class="content">
      <div class="container-fluid">
        {% block content %}{% endblock %}
      </div>
    </section>
  </div>
  <!-- /.content-wrapper -->

  <footer class="main-footer">
    <strong>کپی‌رایت &copy; 2024 <a href="https://tahrirchishop.com/">تحریرچی‌شاپ</a>.</strong>
  </footer>
</div>
<!-- ./wrapper -->

<!-- REQUIRED SCRIPTS -->
<!-- jQuery -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
<!-- Bootstrap 4 -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/4.6.1/js/bootstrap.bundle.min.js"></script>
<!-- AdminLTE App -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/admin-lte/3.2.0/js/adminlte.min.js"></script>
{% block scripts %}{% endblock %}
</body>
</html>
